[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zevora"
version = "0.1.0"
description = "Zero-External Vendor Oriented Reasoning Agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "httpx2>=2.0,<3", "psutil>=6.0,<8", "zstandard>=0.23,<1", "pypdf>=5.0,<7", "llama-cpp-python>=0.3.14,<0.4"]

[project.scripts]
# Console entry point — used in terminal: zevora start / stop / status / etc.
zevora = "zevora.cli:main"

[project.gui-scripts]
# Windowless entry point — double-click or taskbar shortcut.
# Starts the gateway silently and opens the browser; no console window appears.
zevora-w = "zevora.cli:main_silent"

[tool.setuptools.packages.find]
include = ["agent*", "zevora*"]
